# Required check on main (DR-0053; Standard §4.4, item 20). A change that removes a type from the
# Human Floor signature list, turns a fixed type into org-choice, lowers a quorum, changes the
# trusted removal list, or removes or changes a protected clause of the no-removal baseline waits
# for the human approval of the review environment `human-floor`. Its reviewers are the accounts
# that hold a credential in force for the governing seat (GOV); no bot approves it. Every other
# change skips the gate, and a skipped gate passes. Both jobs, detect and human-floor-gate, are
# required checks, so a detector that fails blocks the merge instead of skipping the gate.
# - Trusted code: the detector is the copy on the base branch, never the pull request's head.
# - Quorum: the gate counts the distinct approvals recorded for this run and needs at least the
#   highest quorum among the types the change touches (1 by default); fewer fail closed.
name: human-floor-gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.d.outputs.needed }}
      quorum: ${{ steps.d.outputs.quorum }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change touch the Human Floor?
        id: d
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          f=.github/scripts/check_floor_gate.py
          mkdir -p "$RUNNER_TEMP/trusted"
          if git cat-file -e "$BASE:$f" 2>/dev/null; then
            git show "$BASE:$f" > "$RUNNER_TEMP/trusted/check_floor_gate.py"
          else
            echo "::warning::$f is not on the base branch yet. This .github/-only pull request introduces it, so its own copy runs this once."
            cp "$f" "$RUNNER_TEMP/trusted/check_floor_gate.py"
          fi
          python3 "$RUNNER_TEMP/trusted/check_floor_gate.py" "$BASE" HEAD
  human-floor-gate:
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    runs-on: ubuntu-latest
    environment: human-floor
    steps:
      - name: Count the distinct human approvals of this run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUORUM: ${{ needs.detect.outputs.quorum }}
        run: |
          N=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals" \
                --jq '[.[] | select(.state == "approved") | select(any(.environments[]; .name == "human-floor")) | .user.login] | unique | length')
          echo "human-floor-gate: $N distinct approval(s); the quorum is $QUORUM"
          if [ -z "$N" ] || [ "$N" -lt "$QUORUM" ]; then echo "::error::HUMAN-FLOOR-QUORUM: $N approval(s), $QUORUM needed"; exit 1; fi
