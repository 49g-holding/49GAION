# Required check on main. Every AIOC, Pod or Cell code and every HOAC label example in the
# 49GAION Standard and the Naming Standard (hub) validates against the unit card schema (protocol).
# The companion repository is read at main, or at the ref in the repository variable
# HUB_REF / PROTOCOL_REF when set and still present.
name: code-examples
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  code-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Fetch companion repository
        run: |
          bash .github/scripts/fetch.sh 49GAION-protocol .deps/protocol "${{ vars.PROTOCOL_REF }}"
      - name: Validate code examples
        env:
          HUB_DIR: .
          SCHEMA: .deps/protocol/spec/schemas/unit-card.schema.json
        run: python3 .github/scripts/check_code_examples.py
