# Required check on main. Every heading, section/rule/decision id, term and key concept of
# the hub baseline must still be present: .github/no-removal/v2.0-baseline.tsv from v2.0.0 on
# (generated from the clean texts, DR-0047), v1.4-baseline.tsv before it; the check picks the
# baseline of the release the texts are at (state.json).
# Presence only, never definition text. A HOAC term must stand on its own heading, glossary
# row or bold definition lead; the token anywhere else in the file does not count.
# Script and baseline are the copies on the base branch (trusted code).
name: no-removal
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-removal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load the check from the base branch (trusted code)
        shell: bash
        env:
          TRUSTED: ${{ github.event.pull_request.base.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          FILES: ".github/scripts/check_no_removal.py .github/no-removal/v1.4-baseline.tsv .github/no-removal/v2.0-baseline.tsv"
        run: |
          # The check that judges a change is always the copy on the base branch (main),
          # read with git show, never the working tree of the pull request.
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trusted"
          for f in $FILES; do
            if git cat-file -e "$TRUSTED:$f" 2>/dev/null; then
              git show "$TRUSTED:$f" > "$RUNNER_TEMP/trusted/$(basename "$f")"
            elif [ "$EVENT" = pull_request ] && [ -z "$(git diff --name-only "$BASE"...HEAD | grep -v "^\.github/" || true)" ]; then
              echo "::warning::$f is not on the base branch yet. This .github/-only pull request introduces it, so its own copy runs this once."
              cp "$f" "$RUNNER_TEMP/trusted/$(basename "$f")"
            else
              echo "::error::$f cannot be read from the base branch ($TRUSTED); failing closed."
              exit 1
            fi
          done
      - name: Check the baseline is present
        env:
          NO_REMOVAL_DIR: ${{ runner.temp }}/trusted
        run: python3 "$RUNNER_TEMP/trusted/check_no_removal.py"
