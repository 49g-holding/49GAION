# Required check on main. Runs the must-fail and must-pass cases of every check in this
# repository (.github/tests/selftest.py). A must-fail case counts only when it fails on its
# own rule with the named error code in the log.
name: ci-selftest
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Fetch companion repositories
        run: |
          bash .github/scripts/fetch.sh 49GAION-protocol .deps/protocol "${{ vars.PROTOCOL_REF }}"
          bash .github/scripts/fetch.sh 49GAION-aioc .deps/aioc "${{ vars.AIOC_REF }}"
      - name: Must-fail and must-pass cases
        env:
          REF_DEPS: ${{ github.workspace }}/.deps
        run: python3 .github/tests/selftest.py
